<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Comentarios - Test Navegador</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: white; margin-bottom: 20px; text-align: center; }
        h2 { color: #333; margin-bottom: 15px; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); opacity: 0.9; }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            margin: 10px 0;
        }
        .status {
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: bold;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .comment {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
        }
        .log {
            background: #1e1e2e;
            color: #a6e3a1;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .button-group { display: flex; gap: 10px; flex-wrap: wrap; margin: 15px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Supabase - Sistema de Comentarios</h1>
        
        <div class="card">
            <h2>🔌 Estado de Conexión</h2>
            <div id="status" class="status">Conectando a Supabase...</div>
            <div class="button-group">
                <button onclick="testConnection()">🔄 Probar Conexión</button>
                <button onclick="createTable()">📦 Crear Tabla (SQL)</button>
                <button onclick="resetTable()">🔄 Resetear Tabla</button>
            </div>
        </div>

        <div class="card">
            <h2>💬 Escribir Comentario</h2>
            <input type="text" id="commentInput" placeholder="Escribe tu comentario aquí..." autocomplete="off">
            <button onclick="submitComment()" style="width: 100%;">✉️ Publicar Comentario</button>
            <div id="feedback" style="margin-top: 10px; font-size: 14px;"></div>
        </div>

        <div class="card">
            <h2>📝 Comentarios Recientes</h2>
            <div class="button-group">
                <button onclick="loadComments()">🔄 Actualizar Comentarios</button>
                <button onclick="deleteAllComments()">🗑️ Borrar Todos</button>
            </div>
            <div id="commentsList">Cargando comentarios...</div>
        </div>

        <div class="card">
            <h2>📋 Log de Actividad</h2>
            <div class="log" id="log">
                🟢 Inicializando sistema...<br>
            </div>
            <button onclick="clearLog()" style="margin-top: 10px;">🧹 Limpiar Log</button>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN
        const SUPABASE_URL = "https://pnhifykhqbtgxrcjqgmv.supabase.co";
        const SUPABASE_KEY = "sb_publishable_rY4GP3zZ-DspAGqfYJnfMQ_QAqnidaL";
        const TABLE_NAME = "comentarios_app";
        
        let supabase;
        
        function addLog(message, type = "info") {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const icon = type === "success" ? "✅" : type === "error" ? "❌" : type === "warning" ? "⚠️" : "ℹ️";
            logDiv.innerHTML += `<div>${icon} [${time}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = "🧹 Log limpiado<br>";
            addLog("Log reiniciado", "info");
        }
        
        async function testConnection() {
            addLog("Probando conexión a Supabase...");
            const statusDiv = document.getElementById('status');
            
            try {
                const start = Date.now();
                const { error } = await supabase.from(TABLE_NAME).select('count', { count: 'exact', head: true });
                const latency = Date.now() - start;
                
                if (error && error.message.includes("does not exist")) {
                    statusDiv.innerHTML = `<div class="warning">✅ Conectado (${latency}ms) - La tabla '${TABLE_NAME}' no existe. Haz clic en 'Crear Tabla'</div>`;
                    addLog(`Conexión OK (${latency}ms) pero falta la tabla`, "warning");
                } else if (!error) {
                    statusDiv.innerHTML = `<div class="success">✅ Conectado exitosamente (${latency}ms) - Tabla lista</div>`;
                    addLog(`Conexión exitosa (${latency}ms)`, "success");
                    loadComments();
                } else {
                    throw error;
                }
            } catch (err) {
                statusDiv.innerHTML = `<div class="error">❌ Error de conexión: ${err.message}</div>`;
                addLog(`Error: ${err.message}`, "error");
            }
        }
        
        function createTable() {
            const sql = `-- EJECUTA ESTE SQL EN SUPABASE DASHBOARD
-- 1. Ir a: https://app.supabase.com/project/pnhifykhqbtgxrcjqgmv/sql
-- 2. Crear nueva query
-- 3. Pegar y ejecutar:

CREATE TABLE IF NOT EXISTS ${TABLE_NAME} (
    id SERIAL PRIMARY KEY,
    contenido TEXT NOT NULL,
    created_at TIMESTAMPTZ DEFAULT NOW()
);

-- Deshabilitar RLS para pruebas
ALTER TABLE ${TABLE_NAME} DISABLE ROW LEVEL SECURITY;

-- Insertar comentario de prueba
INSERT INTO ${TABLE_NAME} (contenido) VALUES ('🎉 Primer comentario desde la web!');

-- Verificar
SELECT * FROM ${TABLE_NAME};`;
            
            navigator.clipboard.writeText(sql);
            addLog("✅ SQL copiado al portapapeles", "success");
            addLog("📋 Instrucciones:", "info");
            addLog("1. Abre Supabase Dashboard → SQL Editor", "info");
            addLog("2. Pega (Ctrl+V) y ejecuta", "info");
            addLog("3. Vuelve aquí y haz clic en 'Probar Conexión'", "info");
            
            alert("✅ SQL copiado al portapapeles!\n\n1. Ve a Supabase Dashboard\n2. SQL Editor\n3. Pega y ejecuta\n4. Vuelve aquí y prueba la conexión");
        }
        
        async function resetTable() {
            if (!confirm("⚠️ ¿Borrar TODOS los comentarios y recrear la tabla?")) return;
            
            addLog("Intentando resetear tabla...", "warning");
            try {
                const { error } = await supabase.rpc('drop_table_if_exists', { table_name: TABLE_NAME });
                if (error) throw error;
                addLog("Tabla eliminada, ahora créala con el botón 'Crear Tabla'", "success");
            } catch (err) {
                addLog("No se puede borrar automáticamente. Usa SQL manual.", "error");
                createTable();
            }
        }
        
        async function submitComment() {
            const input = document.getElementById('commentInput');
            const content = input.value.trim();
            
            if (!content) {
                document.getElementById('feedback').innerHTML = '<div class="error">❌ Escribe un comentario primero</div>';
                setTimeout(() => document.getElementById('feedback').innerHTML = '', 2000);
                return;
            }
            
            document.getElementById('feedback').innerHTML = '<div class="warning">⏳ Enviando...</div>';
            
            try {
                const { data, error } = await supabase
                    .from(TABLE_NAME)
                    .insert([{ contenido: content }])
                    .select();
                
                if (error) throw error;
                
                document.getElementById('feedback').innerHTML = '<div class="success">✅ ¡Comentario publicado!</div>';
                input.value = "";
                addLog(`Comentario enviado: "${content.substring(0, 50)}"`, "success");
                loadComments();
                setTimeout(() => document.getElementById('feedback').innerHTML = '', 2000);
            } catch (err) {
                document.getElementById('feedback').innerHTML = `<div class="error">❌ Error: ${err.message}</div>`;
                addLog(`Error al enviar: ${err.message}`, "error");
                
                if (err.message.includes("does not exist")) {
                    addLog("💡 La tabla no existe. Usa 'Crear Tabla' primero", "warning");
                }
            }
        }
        
        async function loadComments() {
            addLog("Cargando comentarios...");
            
            try {
                const { data, error } = await supabase
                    .from(TABLE_NAME)
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(20);
                
                if (error) throw error;
                
                const container = document.getElementById('commentsList');
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="warning">📭 No hay comentarios aún. ¡Escribe el primero!</div>';
                    addLog("No hay comentarios", "info");
                } else {
                    container.innerHTML = data.map(comment => `
                        <div class="comment">
                            <div style="font-size: 16px; margin-bottom: 8px;">💬 ${escapeHtml(comment.contenido)}</div>
                            <div style="font-size: 12px; color: #666;">
                                📅 ${new Date(comment.created_at).toLocaleString()}
                            </div>
                        </div>
                    `).join('');
                    addLog(`Cargados ${data.length} comentarios`, "success");
                }
            } catch (err) {
                document.getElementById('commentsList').innerHTML = `<div class="error">❌ Error: ${err.message}</div>`;
                addLog(`Error cargando: ${err.message}`, "error");
            }
        }
        
        async function deleteAllComments() {
            if (!confirm("⚠️ ¿Borrar TODOS los comentarios? Esta acción no se puede deshacer.")) return;
            
            addLog("Borrando todos los comentarios...", "warning");
            try {
                const { error } = await supabase
                    .from(TABLE_NAME)
                    .delete()
                    .neq('id', 0);
                
                if (error) throw error;
                addLog("✅ Todos los comentarios fueron borrados", "success");
                loadComments();
            } catch (err) {
                addLog(`Error al borrar: ${err.message}`, "error");
            }
        }
        
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        
        // Inicializar
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            addLog("✅ Cliente Supabase inicializado", "success");
            testConnection();
        } catch (err) {
            addLog(`❌ Error fatal: ${err.message}`, "error");
        }
    </script>
</body>
</html>
